<svg fill="none" viewBox="0 0 1200 340" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Text & Border Gradients -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: url(#accent-grad);
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .pill-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      stroke-opacity: 0.4;
    }
    
    /* Animated dynamic background circuit pulses */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.45; }
    }
    @keyframes pulseCyan {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.2; }
      50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.4; }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .orb-purple {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 950px 100px;
    }
    .orb-cyan {
      animation: pulseCyan 10s ease-in-out infinite;
      transform-origin: 150px 220px;
    }
    .flow-stream {
      stroke-dasharray: 8, 12;
      animation: dashCycle 2.5s linear infinite;
    }
    .floating-badge {
      animation: floatCard 4s ease-in-out infinite;
    }
  </style>

  <!-- Deep Base Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Animated Ambient Glow Orbs in Background -->
  <circle class="orb-purple" cx="980" cy="110" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle class="orb-cyan" cx="160" cy="220" r="130" fill="#06b6d4" opacity="0.2" filter="url(#glow)" />
  <circle cx="600" cy="30" r="100" fill="#a855f7" opacity="0.15" filter="url(#glow)" />

  <!-- Geometric Grid Background Pattern -->
  <g class="grid-line">
    <line x1="100" y1="0" x2="100" y2="340" />
    <line x1="250" y1="0" x2="250" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="550" y1="0" x2="550" y2="340" />
    <line x1="700" y1="0" x2="700" y2="340" />
    <line x1="850" y1="0" x2="850" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
    <line x1="1150" y1="0" x2="1150" y2="340" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="130" x2="1200" y2="130" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Dynamic Animated API Flow Curves (behind text) -->
  <g opacity="0.7">
    <path class="flow-stream" d="M 50 80 Q 250 30, 500 80 T 950 60 T 1150 90" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-stream" d="M 80 290 Q 350 330, 650 280 T 1000 310 T 1150 270" fill="none" stroke="#a855f7" stroke-width="2" />
    <path class="flow-stream" d="M 0 170 Q 300 210, 600 170 T 1200 160" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5" />
  </g>

  <!-- Floating Feature Pills / Cards (placed safely away from title) -->
  <g class="floating-badge">
    <!-- GET /200 OK Pill -->
    <rect x="70" y="38" width="130" height="34" rx="17" fill="url(#pill-grad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="88" cy="55" r="5" fill="#10b981" />
    <text x="102" y="59" fill="#34d399" class="pill-text">GET 200 OK</text>

    <!-- POST /api/v1 Pill -->
    <rect x="1000" y="40" width="130" height="34" rx="17" fill="url(#pill-grad)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="1018" cy="57" r="5" fill="#818cf8" />
    <text x="1032" y="61" fill="#a5b4fc" class="pill-text">REST / API</text>
  </g>

  <!-- MAIN FOREGROUND TITLE & SUBTITLE (Never blocked) -->
  <g text-anchor="middle">
    <!-- Category Badge Top -->
    <rect x="495" y="46" width="210" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <text x="600" y="65" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚡ ECOSYSTEM ARCHIVE</text>

    <!-- Main Title -->
    <text x="600" y="142" class="title-text" filter="url(#soft-glow)">Awesome REST API</text>

    <!-- Subtitle -->
    <text x="600" y="185" class="subtitle-text">Curated Architectures, Enterprise SaaS Platforms &amp; Open-Source Frameworks</text>

    <!-- Badges / Tags row below title -->
    <g transform="translate(0, 222)">
      <!-- OpenAPI Pill -->
      <g transform="translate(240, 0)">
        <rect x="0" y="0" width="135" height="34" rx="17" fill="url(#pill-grad)" stroke="#64748b" stroke-width="1" />
        <text x="67" y="22" fill="#e2e8f0" class="pill-text" text-anchor="middle">⚡ OpenAPI 3.1</text>
      </g>
      <!-- API Gateways Pill -->
      <g transform="translate(390, 0)">
        <rect x="0" y="0" width="135" height="34" rx="17" fill="url(#pill-grad)" stroke="#64748b" stroke-width="1" />
        <text x="67" y="22" fill="#e2e8f0" class="pill-text" text-anchor="middle">🛡️ Gateways</text>
      </g>
      <!-- Frameworks Pill -->
      <g transform="translate(540, 0)">
        <rect x="0" y="0" width="135" height="34" rx="17" fill="url(#pill-grad)" stroke="#64748b" stroke-width="1" />
        <text x="67" y="22" fill="#e2e8f0" class="pill-text" text-anchor="middle">🚀 Frameworks</text>
      </g>
      <!-- Testing & Docs Pill -->
      <g transform="translate(690, 0)">
        <rect x="0" y="0" width="135" height="34" rx="17" fill="url(#pill-grad)" stroke="#64748b" stroke-width="1" />
        <text x="67" y="22" fill="#e2e8f0" class="pill-text" text-anchor="middle">📖 Documentation</text>
      </g>
      <!-- SDK Codegen Pill -->
      <g transform="translate(840, 0)">
        <rect x="0" y="0" width="125" height="34" rx="17" fill="url(#pill-grad)" stroke="#64748b" stroke-width="1" />
        <text x="62" y="22" fill="#e2e8f0" class="pill-text" text-anchor="middle">⚙️ Codegen</text>
      </g>
    </g>

    <!-- Bottom Status / Protocol Footer Line -->
    <text x="600" y="300" font-family="ui-monospace, monospace" font-size="12" fill="#64748b" letter-spacing="1">HTTP/1.1 · HTTP/2 · HTTP/3 · JSON · OAUTH 2.0 · HATEOAS</text>
  </g>
</svg>
